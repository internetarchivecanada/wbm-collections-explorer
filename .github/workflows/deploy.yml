name: Build and deploy the serverless edition

on:
  push:
    branches: [main]
  schedule:
    # 16:30 UTC: at least an hour after the studio's nightly harvest, which
    # starts 06:45 Pacific (13:45 UTC summer, 14:45 UTC winter) and takes ~10 min
    - cron: '30 16 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -r requirements-build.txt

      - id: pages
        uses: actions/configure-pages@v6

      - name: Test
        run: |
          python test_refresh.py
          python test_fetch_snapshot.py

      # The studio host harvests web.archive.org nightly from inside the IA
      # network. Re-harvesting from a runner was refused or throttled, and from
      # 2026-10-01 it overran the job timeout every night. Take the studio's
      # published dataset on every trigger. If it cannot be fetched or fails a
      # check, the job stops here and Pages keeps serving the last good site;
      # building from the committed dataset instead would roll the site back.
      - name: Fetch the studio's nightly dataset
        timeout-minutes: 5
        run: python fetch_snapshot.py

      - name: Build the static site
        run: |
          python build.py \
            --base "${{ steps.pages.outputs.base_path }}/" \
            --site-url "${{ steps.pages.outputs.base_url }}"

      - name: Check the build
        run: python check_build.py dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
